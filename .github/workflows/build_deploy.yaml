# Build the Sphinx book and deploy it to GitHub Pages.
name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# peaceiris pushes the built site to the gh-pages branch with GITHUB_TOKEN.
permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lang: [en, zh]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install doc dependencies
        run: pip install -r requirements-docs.txt

      - name: Build ${{ matrix.lang }} (Sphinx, warnings as errors)
        run: sphinx-build -b html -D language=${{ matrix.lang }} . _build/html_${{ matrix.lang }} -W --keep-going

      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: html-${{ matrix.lang }}
          path: _build/html_${{ matrix.lang }}

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_build/html_${{ matrix.lang }}
          # English site serves at root, Chinese at /zh/
          # https://mlc.ai/modern-gpu-programming-for-mlsys/
          # https://mlc.ai/modern-gpu-programming-for-mlsys/zh/
          destination_dir: ${{ matrix.lang == 'zh' && 'zh' || '' }}
          # No custom domain: the site serves at the org default,
          # https://mlc.ai/modern-gpu-programming-for-mlsys/ . To use a custom domain, add a
          # `cname:` line here and the matching DNS record.
